<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITS – Neue Lektion erstellen</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1c2733; --muted:#64748b;
          --accent:#2563eb; --ok:#16a34a; --border:#e2e8f0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); }
  .wrap { max-width: 820px; margin:0 auto; padding:24px 16px 80px; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:20px; }
  header h1 { font-size:1.25rem; margin:0; }
  header a { color:var(--muted); font-size:.85rem; text-decoration:none; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px;
          padding:20px; margin-bottom:16px; }
  label { font-weight:600; display:block; margin:14px 0 6px; }
  label:first-of-type { margin-top:0; }
  .sub { font-weight:400; color:var(--muted); font-size:.85rem; }
  input[type=text], textarea { width:100%; padding:10px 12px; border:1px solid var(--border);
    border-radius:8px; font:inherit; resize:vertical; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px;
           padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  button.secondary { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  .btnrow { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  .spinner { color:var(--muted); font-size:.9rem; }
  .success { border-left:4px solid var(--ok); background:#f0fdf4; padding:14px;
             border-radius:0 8px 8px 0; margin-top:14px; }
  .error { border-left:4px solid #dc2626; background:#fef2f2; padding:14px;
           border-radius:0 8px 8px 0; margin-top:14px; }
  .hidden { display:none; }
  .charcount { font-size:.78rem; color:var(--muted); text-align:right; margin-top:4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 Neue Lektion erstellen</h1>
    <a href="/teacher">← Zurück zum Monitoring</a>
  </header>

  <div class="card">
    <label>1. Lernmaterial <span class="sub">– Text einfügen oder Datei hochladen (PDF, Word, Text)</span></label>
    <textarea id="material" rows="12" placeholder="Unterrichtsmaterial hier einfügen …"></textarea>
    <div class="charcount"><span id="chars">0</span> Zeichen</div>
    <div class="btnrow">
      <input type="file" id="file" accept=".pdf,.docx,.txt,.md" class="hidden">
      <button class="secondary" onclick="document.getElementById('file').click()">📄 Datei hochladen</button>
      <span class="spinner hidden" id="file-spinner">Text wird extrahiert …</span>
    </div>

    <label>2. Titel und Lernziele
      <span class="sub">– selbst schreiben oder von der KI vorschlagen lassen</span></label>
    <div class="btnrow" style="margin-bottom:10px">
      <button class="secondary" id="btn-suggest">✨ Titel &amp; Lernziele vorschlagen (KI)</button>
      <span class="spinner hidden" id="suggest-spinner">KI analysiert das Material …</span>
    </div>
    <input type="text" id="titel" placeholder="Titel der Lektion">
    <textarea id="ziele" rows="5" style="margin-top:8px"
      placeholder="Lernziele – ein Ziel pro Zeile&#10;z.B. Die vier Voraussetzungen der Verschuldenshaftung erklären"></textarea>

    <label>3. Tutorverhalten <span class="sub">– optionale Hinweise an den Tutor</span></label>
    <textarea id="hinweise" rows="3"
      placeholder="z.B. «Arbeite viel mit Alltagsbeispielen aus der Berufswelt», «Sei streng bei Fachbegriffen», «Stelle oft Rückfragen» …"></textarea>

    <div class="btnrow" style="margin-top:20px">
      <button id="btn-save">Lektion speichern &amp; veröffentlichen</button>
      <span class="spinner hidden" id="save-spinner">Wird gespeichert …</span>
    </div>
    <div id="result" class="hidden"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

$("material").addEventListener("input", () =>
  $("chars").textContent = $("material").value.length);

$("file").addEventListener("change", async () => {
  const f = $("file").files[0];
  if (!f) return;
  $("file-spinner").classList.remove("hidden");
  try {
    const fd = new FormData();
    fd.append("file", f);
    const r = await fetch("/api/teacher/lessons/extract", { method: "POST", body: fd });
    const d = await r.json();
    if (r.status === 401) { location.href = "/teacher/login"; return; }
    if (!r.ok) throw new Error(d.detail || "Extraktion fehlgeschlagen");
    const cur = $("material").value.trim();
    $("material").value = (cur ? cur + "\n\n" : "") + d.text;
    $("chars").textContent = $("material").value.length;
    showResult("success", `Text aus «${f.name}» übernommen (${d.chars} Zeichen). Bitte kurz prüfen und ggf. kürzen.`);
  } catch (e) { showResult("error", e.message); }
  $("file-spinner").classList.add("hidden");
  $("file").value = "";
});

$("btn-suggest").onclick = async () => {
  const material = $("material").value.trim();
  if (material.length < 100) { showResult("error", "Zuerst Material einfügen (mindestens 100 Zeichen)."); return; }
  $("btn-suggest").disabled = true; $("suggest-spinner").classList.remove("hidden");
  try {
    const r = await fetch("/api/teacher/lessons/suggest-goals", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ material }),
    });
    const d = await r.json();
    if (r.status === 401) { location.href = "/teacher/login"; return; }
    if (!r.ok) throw new Error(d.detail || "Vorschlag fehlgeschlagen");
    if (d.titel && !$("titel").value.trim()) $("titel").value = d.titel;
    if (d.lernziele && d.lernziele.length) $("ziele").value = d.lernziele.join("\n");
    showResult("success", "Vorschlag übernommen – bitte prüfen und anpassen.");
  } catch (e) { showResult("error", e.message); }
  $("btn-suggest").disabled = false; $("suggest-spinner").classList.add("hidden");
};

$("btn-save").onclick = async () => {
  const body = {
    titel: $("titel").value.trim(),
    lernziele: $("ziele").value.split("\n").map(z => z.trim()).filter(Boolean),
    material: $("material").value.trim(),
    tutor_hinweise: $("hinweise").value.trim(),
  };
  $("btn-save").disabled = true; $("save-spinner").classList.remove("hidden");
  try {
    const r = await fetch("/api/teacher/lessons", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (r.status === 401) { location.href = "/teacher/login"; return; }
    if (!r.ok) throw new Error(d.detail || "Speichern fehlgeschlagen");
    showResult("success", `✅ Lektion «${esc(d.titel)}» ist veröffentlicht. Lernende können sie
      jetzt auf der <a href="/">Startseite</a> auswählen.`);
  } catch (e) { showResult("error", e.message); }
  $("btn-save").disabled = false; $("save-spinner").classList.add("hidden");
};

function showResult(cls, html) {
  const el = $("result");
  el.className = cls;
  el.innerHTML = html;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
</script>
</body>
</html>
