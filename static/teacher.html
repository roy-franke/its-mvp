<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITS – Lehrpersonen-Monitoring</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1c2733; --muted:#64748b;
          --accent:#2563eb; --border:#e2e8f0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); }
  .wrap { max-width: 1000px; margin:0 auto; padding:24px 16px 80px; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:20px; }
  header h1 { font-size:1.25rem; margin:0; }
  header a { color:var(--muted); font-size:.85rem; text-decoration:none; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px;
          padding:20px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; font-size:.8rem; text-transform:uppercase; }
  tr.clickable { cursor:pointer; }
  tr.clickable:hover { background:#f8fafc; }
  .pill { font-size:.75rem; padding:2px 10px; border-radius:999px; border:1px solid var(--border); }
  .pill.finished { background:#f0fdf4; color:#16a34a; border-color:#bbf7d0; }
  .pill.learning { background:#eff6ff; color:var(--accent); border-color:#bfdbfe; }
  .pill.assessment { background:#fffbeb; color:#d97706; border-color:#fde68a; }
  .bar { width:120px; height:8px; background:var(--border); border-radius:4px; overflow:hidden; display:inline-block; vertical-align:middle; }
  .bar > div { height:100%; background:var(--accent); }
  .event { border-left:3px solid var(--border); padding:8px 12px; margin:6px 0; font-size:.88rem; }
  .event .t { color:var(--muted); font-size:.75rem; }
  .event.task { border-color:var(--accent); }
  .event.answer_evaluated.ok { border-color:#16a34a; }
  .event.answer_evaluated.nok { border-color:#dc2626; }
  .event.chat_question, .event.chat_reply { border-color:#7c3aed; }
  .muted { color:var(--muted); }
  button.small { background:none; border:1px solid var(--border); border-radius:6px;
                 padding:4px 12px; cursor:pointer; font-size:.8rem; }
  pre { white-space:pre-wrap; margin:4px 0 0; font:inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>👩‍🏫 ITS – Lehrpersonen-Monitoring</h1>
    <span>
      <a href="/teacher/lessons/new" style="margin-right:14px">📚 Neue Lektion erstellen</a>
      <a href="/">Zur Lernenden-Ansicht</a>
    </span>
  </header>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <strong>Aktive und abgeschlossene Lernsequenzen</strong>
      <button class="small" onclick="loadSessions()">Aktualisieren</button>
    </div>
    <table>
      <thead><tr>
        <th>Name</th><th>Lektion</th><th>Status</th><th>Fortschritt</th><th>Niveau</th>
        <th>Quote</th><th>Konzepte</th><th>Zuletzt aktiv</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="muted" id="empty" style="display:none">Noch keine Sessions vorhanden.</p>
  </div>

  <div class="card" id="detail" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong id="detail-title"></strong>
      <button class="small" onclick="document.getElementById('detail').style.display='none'">Schliessen</button>
    </div>
    <div id="detail-events"></div>
  </div>
</div>

<script>
const LABEL = { basic:"Grundlagen", intermediate:"Fortgeschritten", advanced:"Vertieft" };
const PHASE = { assessment:"Einstufung", learning:"Am Lernen", finished:"Abgeschlossen" };

async function loadSessions() {
  const r = await fetch("/api/teacher/sessions");
  const list = await r.json();
  document.getElementById("empty").style.display = list.length ? "none" : "block";
  document.getElementById("rows").innerHTML = list.map(s => `
    <tr class="clickable" onclick="loadDetail('${s.session_id}', '${esc(s.name)}')">
      <td><strong>${esc(s.name)}</strong></td>
      <td class="muted">${esc(s.lesson_id)}</td>
      <td><span class="pill ${s.phase}">${PHASE[s.phase] || s.phase}</span></td>
      <td><span class="bar"><div style="width:${100 * s.step / s.total_steps}%"></div></span>
          <span class="muted">${s.step}/${s.total_steps}</span></td>
      <td>${LABEL[s.level] || s.level}</td>
      <td>${Math.round(s.correct_rate * 100)} %</td>
      <td class="muted">${s.covered.map(esc).join(", ") || "–"}</td>
      <td class="muted">${new Date(s.updated_at * 1000).toLocaleString("de-CH")}</td>
    </tr>`).join("");
}

async function loadDetail(sid, name) {
  const r = await fetch("/api/teacher/sessions/" + sid);
  const d = await r.json();
  document.getElementById("detail-title").textContent = "Lernverlauf von " + name;
  document.getElementById("detail-events").innerHTML = d.events.map(ev => {
    const time = new Date(ev.created_at * 1000).toLocaleTimeString("de-CH");
    const p = ev.payload;
    let cls = ev.type, body = "";
    if (ev.type === "session_started") body = `Session gestartet – Lektion: ${esc(p.lesson)}`;
    else if (ev.type === "assessment_questions") body = `Einstufungsfragen: ${p.questions.map(esc).join(" | ")}`;
    else if (ev.type === "assessment_evaluated") body = `Einstufung: <strong>${LABEL[p.level] || p.level}</strong> – ${esc(p.begruendung)}<br><span class="muted">Antworten: ${p.answers.map(esc).join(" | ")}</span>`;
    else if (ev.type === "task") body = `📝 Aufgabe: <strong>${esc(p.titel)}</strong> (${esc(p.konzept)})<br><span class="muted">${esc(p.frage)}</span>`;
    else if (ev.type === "answer_submitted") body = `💬 Antwort: <pre>${esc(p.answer)}</pre>`;
    else if (ev.type === "answer_evaluated") {
      cls += p.korrekt ? " ok" : " nok";
      body = `${p.korrekt ? "✅ richtig" : "❌ falsch"} – ${esc(p.feedback)}`
        + (p.adaption_begruendung ? `<br><span class="muted">🧭 Adaption (${esc(p.adaption)}): ${esc(p.adaption_begruendung)}</span>` : "");
    }
    else if (ev.type === "chat_question") body = `❓ Verständnisfrage: <em>${esc(p.frage)}</em>`;
    else if (ev.type === "chat_reply") body = `💬 Tutor: ${esc(p.antwort)}`;
    else if (ev.type === "finished") body = `🎉 Abgeschlossen – ${esc(p.zusammenfassung)}`;
    else body = esc(JSON.stringify(p));
    return `<div class="event ${cls}"><span class="t">${time}</span><br>${body}</div>`;
  }).join("");
  document.getElementById("detail").style.display = "block";
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
loadSessions();
setInterval(loadSessions, 15000);
</script>
</body>
</html>
