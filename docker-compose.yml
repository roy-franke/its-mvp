# ITS-MVP mit HTTPS-Reverse-Proxy (Caddy).
# Anleitung: docs/DEPLOYMENT.md
services:
  its:
    build:
      context: .
      args:
        # T-31: Commit fuer die Versionsanzeige, z.B. ITS_GIT_COMMIT=$(git rev-parse --short HEAD) docker compose build
        ITS_GIT_COMMIT: ${ITS_GIT_COMMIT:-}
    env_file: .env
    volumes:
      - its-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ITS_DOMAIN=${ITS_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  its-data:
  caddy-data:
  caddy-config:
